<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PropIA Admin</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#111118;--surface2:#18181f;--surface3:#1f1f28;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --purple:#a78bfa;--p2:#7c3aed;--p-glow:rgba(167,139,250,.15);
  --teal:#2dd4bf;--t-glow:rgba(45,212,191,.12);
  --amber:#fbbf24;--red:#f87171;--green:#34d399;
  --text:#f1f0ff;--text2:#a09ec0;--text3:#6b698a;
  --mono:'JetBrains Mono',monospace;
  --display:'Syne',sans-serif;
}
body{font-family:var(--mono);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── LOGIN SCREEN ── */
#loginScreen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,58,237,.18) 0%, transparent 70%);
}
.login-box{
  width:100%;max-width:380px;padding:0 20px;
  animation:fadeUp .4s ease;
}
.login-logo{
  text-align:center;margin-bottom:32px;
}
.login-logo-mark{
  width:56px;height:56px;border-radius:16px;
  background:linear-gradient(135deg,var(--p2),#4c1d95);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:26px;margin-bottom:12px;
  box-shadow:0 8px 32px rgba(124,58,237,.4);
}
.login-title{font-family:var(--display);font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.5px}
.login-sub{font-size:11px;color:var(--text3);margin-top:4px;letter-spacing:.5px;text-transform:uppercase}
.login-card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:16px;padding:28px;
  box-shadow:0 24px 64px rgba(0,0,0,.5);
}
.login-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;display:block}
.login-input{
  width:100%;background:var(--surface2);border:1px solid var(--border2);
  border-radius:10px;padding:12px 16px;color:var(--text);font-family:var(--mono);
  font-size:14px;outline:none;transition:border-color .2s;
}
.login-input:focus{border-color:var(--purple)}
.login-btn{
  width:100%;margin-top:18px;font-family:var(--mono);font-size:13px;font-weight:700;
  background:linear-gradient(135deg,var(--p2),#4c1d95);color:white;border:none;
  border-radius:10px;padding:13px;cursor:pointer;
  box-shadow:0 4px 20px rgba(124,58,237,.35);transition:all .18s;
  text-transform:uppercase;letter-spacing:.8px;
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(124,58,237,.45)}
.login-err{
  background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);
  border-radius:8px;padding:10px 14px;font-size:12px;color:var(--red);
  margin-top:14px;display:none;
}

/* ── MAIN LAYOUT ── */
#app{display:none;min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,15,.9);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:14px 28px;display:flex;align-items:center;gap:16px;
}
.tb-logo{display:flex;align-items:center;gap:10px}
.tb-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--p2),#4c1d95);display:flex;align-items:center;justify-content:center;font-size:14px}
.tb-name{font-family:var(--display);font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.tb-name span{color:var(--purple)}
.tb-badge{font-size:9px;font-weight:700;color:var(--bg);background:var(--purple);border-radius:4px;padding:2px 7px;text-transform:uppercase;letter-spacing:.5px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.tb-time{font-size:11px;color:var(--text3)}
.tb-logout{font-family:var(--mono);font-size:11px;color:var(--text3);background:none;border:1px solid var(--border2);border-radius:7px;padding:6px 12px;cursor:pointer;transition:all .15s}
.tb-logout:hover{color:var(--red);border-color:rgba(248,113,113,.3)}

/* ── MAIN CONTENT ── */
.main{max-width:1280px;margin:0 auto;padding:28px 24px 60px}

/* ── METRICS ROW ── */
.metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:900px){.metrics-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.metrics-row{grid-template-columns:1fr}}
.metric-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:20px;position:relative;overflow:hidden;
  transition:border-color .2s;
}
.metric-card:hover{border-color:var(--border2)}
.metric-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s}
.metric-card.purple::before{background:var(--p-glow)}
.metric-card.teal::before{background:var(--t-glow)}
.metric-card:hover::before{opacity:1}
.mc-icon{font-size:20px;margin-bottom:10px}
.mc-val{font-family:var(--display);font-size:32px;font-weight:800;color:var(--text);letter-spacing:-1px;line-height:1}
.mc-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-top:6px}
.mc-sub{font-size:11px;color:var(--text2);margin-top:4px}

/* ── PLAN PILLS ── */
.plans-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.plan-pill{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:10px 16px;
}
.pp-dot{width:8px;height:8px;border-radius:50%}
.pp-dot.free{background:var(--text3)}
.pp-dot.basic{background:var(--teal)}
.pp-dot.pro{background:var(--purple)}
.pp-dot.enterprise{background:var(--amber)}
.pp-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.pp-count{font-size:16px;font-weight:700;color:var(--text)}

/* ── SECTION HEADER ── */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.section-title{font-family:var(--display);font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.section-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* ── SEARCH + FILTER BAR ── */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search-input{
  flex:1;min-width:200px;background:var(--surface2);border:1px solid var(--border2);
  border-radius:9px;padding:10px 14px;color:var(--text);font-family:var(--mono);
  font-size:13px;outline:none;transition:border-color .2s;
}
.search-input:focus{border-color:var(--purple)}
.filter-select{
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:9px;padding:10px 14px;color:var(--text);font-family:var(--mono);
  font-size:12px;outline:none;cursor:pointer;
}
.filter-select:focus{border-color:var(--purple)}
.btn-refresh{
  font-family:var(--mono);font-size:12px;color:var(--purple);
  background:var(--p-glow);border:1px solid rgba(167,139,250,.25);
  border-radius:9px;padding:10px 16px;cursor:pointer;transition:all .15s;
}
.btn-refresh:hover{background:rgba(167,139,250,.2)}

/* ── USERS TABLE ── */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:24px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{
  font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.7px;padding:12px 16px;text-align:left;
  background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;
}
td{
  padding:13px 16px;font-size:12px;color:var(--text2);
  border-bottom:1px solid var(--border);vertical-align:middle;
}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.td-name{font-weight:600;color:var(--text);font-size:13px}
.td-email{color:var(--text3);font-size:11px;margin-top:2px}
.td-num{font-family:var(--display);font-size:16px;font-weight:700;color:var(--text);text-align:center}

/* Plan badge */
.plan-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  border-radius:6px;padding:3px 9px;
}
.pb-free{background:rgba(107,105,138,.15);color:var(--text3);border:1px solid rgba(107,105,138,.2)}
.pb-basic{background:rgba(45,212,191,.1);color:var(--teal);border:1px solid rgba(45,212,191,.2)}
.pb-pro{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.2)}
.pb-enterprise{background:rgba(251,191,36,.1);color:var(--amber);border:1px solid rgba(251,191,36,.2)}

/* Action buttons */
.btn-view{
  font-family:var(--mono);font-size:11px;color:var(--purple);
  background:var(--p-glow);border:1px solid rgba(167,139,250,.2);
  border-radius:7px;padding:5px 10px;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.btn-view:hover{background:rgba(167,139,250,.2)}
.btn-del{
  font-family:var(--mono);font-size:11px;color:var(--red);
  background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.15);
  border-radius:7px;padding:5px 10px;cursor:pointer;transition:all .15s;margin-left:6px;
}
.btn-del:hover{background:rgba(248,113,113,.15)}

/* Plan selector */
.plan-sel{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:7px;padding:5px 8px;color:var(--text);font-family:var(--mono);
  font-size:11px;outline:none;cursor:pointer;
}

/* ── PAGINATION ── */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--border)}
.pag-info{font-size:11px;color:var(--text3)}
.pag-btns{display:flex;gap:6px}
.pag-btn{
  font-family:var(--mono);font-size:11px;color:var(--text2);
  background:var(--surface2);border:1px solid var(--border);
  border-radius:7px;padding:5px 11px;cursor:pointer;transition:all .15s;
}
.pag-btn:hover:not(:disabled){border-color:var(--purple);color:var(--purple)}
.pag-btn:disabled{opacity:.3;cursor:default}

/* ── RECENT ACTIVITY ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}}
.activity-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.ac-header{padding:14px 18px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
.ac-item{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.ac-item:last-child{border-bottom:none}
.ac-dot{width:6px;height:6px;border-radius:50%;background:var(--purple);flex-shrink:0}
.ac-main{flex:1;min-width:0}
.ac-name{font-size:12px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-sub{font-size:10px;color:var(--text3);margin-top:1px}

/* ── USER DETAIL MODAL ── */
.modal-ov{
  display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
  align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;
}
.modal-ov.open{display:flex}
.modal-box{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:18px;width:100%;max-width:680px;
  box-shadow:0 32px 80px rgba(0,0,0,.6);
  animation:fadeUp .25s ease;
}
.modal-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--border);
}
.modal-title{font-family:var(--display);font-size:16px;font-weight:700;color:var(--text)}
.modal-close{background:none;border:1px solid var(--border2);color:var(--text3);font-size:16px;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{color:var(--red);border-color:rgba(248,113,113,.3)}
.modal-body{padding:24px}
.user-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
@media(max-width:500px){.user-info-grid{grid-template-columns:1fr}}
.uig-item{background:var(--surface2);border-radius:10px;padding:14px}
.uig-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.uig-val{font-size:14px;font-weight:600;color:var(--text)}
.plan-change-row{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:10px;padding:16px;margin-bottom:20px}
.pcr-label{font-size:12px;color:var(--text2);flex:1}
.pcr-select{background:var(--surface3);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none;cursor:pointer}
.btn-save-plan{font-family:var(--mono);font-size:12px;font-weight:700;color:white;background:linear-gradient(135deg,var(--p2),#4c1d95);border:none;border-radius:8px;padding:9px 16px;cursor:pointer;transition:all .18s}
.btn-save-plan:hover{transform:translateY(-1px)}
.btn-save-plan.saved{background:linear-gradient(135deg,#059669,#047857)}
.modal-sub-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.mini-list{background:var(--surface2);border-radius:10px;overflow:hidden;margin-bottom:18px}
.ml-item{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ml-item:last-child{border-bottom:none}
.ml-name{font-size:12px;color:var(--text);font-weight:500}
.ml-date{font-size:10px;color:var(--text3)}
.ml-empty{padding:16px;text-align:center;font-size:12px;color:var(--text3)}
.danger-zone{background:rgba(248,113,113,.04);border:1px solid rgba(248,113,113,.12);border-radius:10px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dz-label{font-size:12px;color:var(--red)}
.dz-sub{font-size:11px;color:var(--text3);margin-top:2px}
.btn-delete-user{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--red);background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:8px;padding:9px 14px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-delete-user:hover{background:rgba(248,113,113,.2)}

/* ── STATES ── */
.state-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px}
.spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite}
.state-empty{text-align:center;padding:40px;color:var(--text3);font-size:13px}
.alert-bar{border-radius:9px;padding:10px 14px;font-size:12px;margin-bottom:14px;display:none}
.alert-bar.ok{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);color:var(--green);display:block}
.alert-bar.er{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);color:var(--red);display:block}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-mark">🏠</div>
      <div class="login-title">Prop<span style="color:var(--purple)">IA</span> Admin</div>
      <div class="login-sub">Panel de administración</div>
    </div>
    <div class="login-card">
      <label class="login-label">Contraseña de administrador</label>
      <input type="password" id="adminPass" class="login-input" placeholder="••••••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
      <button class="login-btn" onclick="doLogin()">→ Entrar al panel</button>
      <div class="login-err" id="loginErr">Contraseña incorrecta.</div>
    </div>
  </div>
</div>

<!-- ── MAIN APP ── -->
<div id="app">
  <div class="topbar">
    <div class="tb-logo">
      <div class="tb-mark">🏠</div>
      <div class="tb-name">Prop<span>IA</span></div>
      <div class="tb-badge">Admin</div>
    </div>
    <div class="tb-right">
      <div class="tb-time" id="tbTime"></div>
      <button class="tb-logout" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="main">
    <div class="alert-bar" id="globalAlert"></div>

    <!-- Metrics -->
    <div class="metrics-row" id="metricsRow">
      <div class="state-loading" style="grid-column:1/-1"><div class="spinner"></div></div>
    </div>

    <!-- Plan breakdown -->
    <div class="plans-row" id="plansRow"></div>

    <!-- Recent activity -->
    <div class="two-col" id="recentRow"></div>

    <!-- Users table -->
    <div class="section-hd">
      <div>
        <div class="section-title">👥 Usuarios</div>
        <div class="section-sub" id="usersSubtitle">Cargando...</div>
      </div>
    </div>

    <div class="filter-bar">
      <input type="search" class="search-input" id="searchInput" placeholder="🔍 Buscar por nombre o email..." oninput="debounceSearch()"/>
      <select class="filter-select" id="planFilter" onchange="loadUsers(1)">
        <option value="">Todos los planes</option>
        <option value="free">Free</option>
        <option value="basic">Basic</option>
        <option value="pro">Pro</option>
        <option value="enterprise">Enterprise</option>
      </select>
      <button class="btn-refresh" onclick="refresh()">↺ Actualizar</button>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Plan</th>
              <th style="text-align:center">Listings</th>
              <th style="text-align:center">Leads</th>
              <th>Registro</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="usersBody">
            <tr><td colspan="6"><div class="state-loading"><div class="spinner"></div></div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <div class="pag-info" id="pagInfo">—</div>
        <div class="pag-btns">
          <button class="pag-btn" id="btnPrev" onclick="changePage(-1)" disabled>← Anterior</button>
          <button class="pag-btn" id="btnNext" onclick="changePage(1)"  disabled>Siguiente →</button>
        </div>
      </div>
    </div>

  </div><!-- /main -->
</div><!-- /app -->

<!-- ── USER DETAIL MODAL ── -->
<div class="modal-ov" id="userModal">
  <div class="modal-box">
    <div class="modal-hd">
      <div class="modal-title" id="modalTitle">Detalle de usuario</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="user-info-grid" id="userInfoGrid"></div>

      <div class="plan-change-row">
        <div class="pcr-label">Cambiar plan</div>
        <select class="pcr-select" id="planChangeSelect">
          <option value="free">Free</option>
          <option value="basic">Basic — $49/mes</option>
          <option value="pro">Pro — $149/mes</option>
          <option value="enterprise">Enterprise — $399/mes</option>
        </select>
        <button class="btn-save-plan" id="btnSavePlan" onclick="savePlan()">Guardar</button>
      </div>

      <div class="modal-sub-title">Últimos listings</div>
      <div class="mini-list" id="modalListings"></div>

      <div class="modal-sub-title">Últimos leads</div>
      <div class="mini-list" id="modalLeads"></div>

      <div class="danger-zone">
        <div>
          <div class="dz-label">⚠️ Eliminar cuenta</div>
          <div class="dz-sub">Elimina el usuario y todos sus datos permanentemente.</div>
        </div>
        <button class="btn-delete-user" onclick="deleteUser()">Eliminar usuario</button>
      </div>
    </div>
  </div>
</div>

<script>
var ADMIN_SECRET = '';
var currentPage  = 1;
var totalUsers   = 0;
var PAGE_SIZE    = 20;
var currentUserId = null;
var searchTimer  = null;

// ── Login ──────────────────────────────────────────────────────
function doLogin() {
  var pass = document.getElementById('adminPass').value.trim();
  if (!pass) return;
  ADMIN_SECRET = pass;
  // Verify by calling metrics
  fetch('/api/admin?action=metrics', { headers: { 'x-admin-secret': ADMIN_SECRET } })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      if (d.success) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        sessionStorage.setItem('adminSecret', ADMIN_SECRET);
        init();
      } else {
        document.getElementById('loginErr').style.display = 'block';
        ADMIN_SECRET = '';
      }
    })
    .catch(function(){ document.getElementById('loginErr').style.display = 'block'; ADMIN_SECRET = ''; });
}

function doLogout() {
  sessionStorage.removeItem('adminSecret');
  ADMIN_SECRET = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminPass').value = '';
  document.getElementById('loginErr').style.display = 'none';
}

// Auto-login from session
(function(){
  var saved = sessionStorage.getItem('adminSecret');
  if (saved) { document.getElementById('adminPass').value = saved; }
})();

// ── Init ───────────────────────────────────────────────────────
function init() {
  updateClock();
  setInterval(updateClock, 30000);
  loadMetrics();
  loadUsers(1);
}

function updateClock() {
  document.getElementById('tbTime').textContent = new Date().toLocaleString('es-MX', {
    weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'
  });
}

// ── Metrics ────────────────────────────────────────────────────
async function loadMetrics() {
  try {
    var res  = await api('GET', 'metrics');
    var m    = res.metrics;
    var prices = { free: 0, basic: 49, pro: 149, enterprise: 399 };

    document.getElementById('metricsRow').innerHTML = [
      { icon:'👥', val: m.totalUsers,    label:'Usuarios totales',   sub: 'registrados',         cls:'purple' },
      { icon:'🏠', val: m.totalListings, label:'Listings generados',  sub: 'en total',             cls:'teal' },
      { icon:'📥', val: m.totalLeads,    label:'Leads calificados',   sub: 'en pipeline',          cls:'' },
      { icon:'💰', val: '$'+m.mrr.toLocaleString(), label:'MRR estimado', sub: 'USD / mes',       cls:'purple' }
    ].map(function(c){
      return '<div class="metric-card '+c.cls+'">'
        + '<div class="mc-icon">'+c.icon+'</div>'
        + '<div class="mc-val">'+c.val+'</div>'
        + '<div class="mc-label">'+c.label+'</div>'
        + '<div class="mc-sub">'+c.sub+'</div>'
        + '</div>';
    }).join('');

    // Plan pills
    var pb = m.planBreakdown || {};
    var planDefs = [
      { key:'free',       label:'Free',       dot:'free' },
      { key:'basic',      label:'Basic',      dot:'basic' },
      { key:'pro',        label:'Pro',        dot:'pro' },
      { key:'enterprise', label:'Enterprise', dot:'enterprise' }
    ];
    document.getElementById('plansRow').innerHTML = planDefs.map(function(p){
      return '<div class="plan-pill">'
        + '<div class="pp-dot '+p.dot+'"></div>'
        + '<div class="pp-label">'+p.label+'</div>'
        + '<div class="pp-count">'+(pb[p.key]||0)+'</div>'
        + '</div>';
    }).join('');

    // Recent activity
    document.getElementById('recentRow').innerHTML =
      buildRecentCard('🆕 Nuevos usuarios', m.recentUsers, function(u){
        return '<div class="ac-name">'+esc(u.name||u.email)+'</div>'
          + '<div class="ac-sub">'+esc(u.email)+'</div>';
      })
      + buildRecentCard('🏠 Últimos listings', m.recentListings, function(l){
        return '<div class="ac-name">'+esc(l.address)+'</div>'
          + '<div class="ac-sub">'+esc(l.price||'')+'</div>';
      });

  } catch(e) { showAlert('Error cargando métricas: ' + e.message, 'er'); }
}

function buildRecentCard(title, items, renderFn) {
  var html = '<div class="activity-card"><div class="ac-header">'+title+'</div>';
  if (!items || !items.length) {
    html += '<div class="ml-empty">Sin datos recientes</div>';
  } else {
    items.forEach(function(item){
      html += '<div class="ac-item"><div class="ac-dot"></div><div class="ac-main">' + renderFn(item) + '</div>'
        + '<div style="font-size:10px;color:var(--text3)">' + fmtDate(item.created_at) + '</div></div>';
    });
  }
  html += '</div>';
  return html;
}

// ── Users table ────────────────────────────────────────────────
async function loadUsers(page) {
  currentPage = page || 1;
  var search = document.getElementById('searchInput').value.trim();
  var plan   = document.getElementById('planFilter').value;

  document.getElementById('usersBody').innerHTML =
    '<tr><td colspan="6"><div class="state-loading"><div class="spinner"></div></div></td></tr>';

  try {
    var params = new URLSearchParams({ action:'users', page: currentPage, limit: PAGE_SIZE });
    if (search) params.set('search', search);
    if (plan)   params.set('plan', plan);

    var res = await api('GET', null, params.toString());
    totalUsers = res.total || 0;

    document.getElementById('usersSubtitle').textContent = totalUsers + ' usuarios encontrados';
    document.getElementById('pagInfo').textContent =
      'Mostrando ' + (Math.min((currentPage-1)*PAGE_SIZE+1, totalUsers)) + '–' +
      Math.min(currentPage*PAGE_SIZE, totalUsers) + ' de ' + totalUsers;

    document.getElementById('btnPrev').disabled = currentPage <= 1;
    document.getElementById('btnNext').disabled = currentPage * PAGE_SIZE >= totalUsers;

    if (!res.users || !res.users.length) {
      document.getElementById('usersBody').innerHTML =
        '<tr><td colspan="6"><div class="state-empty">Sin usuarios que coincidan.</div></td></tr>';
      return;
    }

    document.getElementById('usersBody').innerHTML = res.users.map(function(u){
      var planCls = 'pb-' + (u.plan||'free');
      var planLbl = { free:'Free', basic:'Basic', pro:'Pro', enterprise:'Enterprise' }[u.plan||'free'] || u.plan;
      return '<tr>'
        + '<td><div class="td-name">'+esc(u.name||'—')+'</div><div class="td-email">'+esc(u.email)+'</div></td>'
        + '<td><span class="plan-badge '+planCls+'">'+planLbl+'</span></td>'
        + '<td class="td-num">'+(u.total_listings||0)+'</td>'
        + '<td class="td-num">'+(u.total_leads||0)+'</td>'
        + '<td style="font-size:11px;color:var(--text3);white-space:nowrap">'+fmtDate(u.created_at)+'</td>'
        + '<td style="white-space:nowrap">'
          + '<button class="btn-view" onclick="openUser(\''+u.id+'\')">Ver detalle</button>'
          + '<button class="btn-del"  onclick="confirmDelete(\''+u.id+'\',\''+esc(u.name||u.email)+'\')">✕</button>'
        + '</td>'
        + '</tr>';
    }).join('');

  } catch(e) {
    document.getElementById('usersBody').innerHTML =
      '<tr><td colspan="6"><div class="state-empty">Error: '+esc(e.message)+'</div></td></tr>';
  }
}

function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){ loadUsers(1); }, 400);
}

function changePage(dir) {
  loadUsers(currentPage + dir);
}

function refresh() {
  loadMetrics();
  loadUsers(currentPage);
}

// ── User detail modal ──────────────────────────────────────────
async function openUser(id) {
  currentUserId = id;
  document.getElementById('userModal').classList.add('open');
  document.getElementById('userInfoGrid').innerHTML = '<div class="state-loading" style="grid-column:1/-1"><div class="spinner"></div></div>';
  document.getElementById('modalListings').innerHTML = '<div class="ml-empty">Cargando...</div>';
  document.getElementById('modalLeads').innerHTML    = '<div class="ml-empty">Cargando...</div>';

  try {
    var res = await api('GET', 'user', 'id='+id);
    var p   = res.profile || {};

    document.getElementById('modalTitle').textContent = p.name || p.email || 'Usuario';
    document.getElementById('planChangeSelect').value = p.plan || 'free';
    document.getElementById('btnSavePlan').textContent = 'Guardar';
    document.getElementById('btnSavePlan').className   = 'btn-save-plan';

    document.getElementById('userInfoGrid').innerHTML = [
      { label:'Email',    val: p.email       || '—' },
      { label:'Teléfono', val: p.phone        || '—' },
      { label:'Brokerage',val: p.brokerage    || '—' },
      { label:'Plan',     val: p.plan         || 'free' },
      { label:'Registro', val: fmtDate(p.created_at) },
      { label:'ID',       val: '<span style="font-size:10px;word-break:break-all">'+esc(p.id||'')+'</span>' }
    ].map(function(f){
      return '<div class="uig-item"><div class="uig-label">'+f.label+'</div><div class="uig-val">'+f.val+'</div></div>';
    }).join('');

    // Listings
    document.getElementById('modalListings').innerHTML = res.listings && res.listings.length
      ? res.listings.map(function(l){
          return '<div class="ml-item"><div><div class="ml-name">'+esc(l.address)+'</div><div style="font-size:10px;color:var(--text3)">'+esc(l.price||'')+'</div></div><div class="ml-date">'+fmtDate(l.created_at)+'</div></div>';
        }).join('')
      : '<div class="ml-empty">Sin listings</div>';

    // Leads
    document.getElementById('modalLeads').innerHTML = res.leads && res.leads.length
      ? res.leads.map(function(l){
          var sc = l.score || 5;
          var c  = sc >= 8 ? 'var(--purple)' : sc >= 6 ? 'var(--teal)' : sc >= 4 ? 'var(--amber)' : 'var(--text3)';
          return '<div class="ml-item">'
            + '<div style="flex:1"><div class="ml-name">'+esc(l.name)+'</div><div style="font-size:10px;color:var(--text3)">'+esc(l.status||'')+'</div></div>'
            + '<div style="font-size:13px;font-weight:700;color:'+c+'">'+sc+'/10</div>'
            + '<div class="ml-date" style="margin-left:12px">'+fmtDate(l.created_at)+'</div>'
            + '</div>';
        }).join('')
      : '<div class="ml-empty">Sin leads</div>';

  } catch(e) {
    document.getElementById('userInfoGrid').innerHTML = '<div class="state-empty" style="grid-column:1/-1">Error: '+esc(e.message)+'</div>';
  }
}

async function savePlan() {
  if (!currentUserId) return;
  var plan = document.getElementById('planChangeSelect').value;
  var btn  = document.getElementById('btnSavePlan');
  btn.textContent = '...'; btn.disabled = true;
  try {
    await api('PATCH', 'update_plan', null, { userId: currentUserId, plan });
    btn.textContent = '✓ Guardado'; btn.className = 'btn-save-plan saved';
    loadUsers(currentPage);
    loadMetrics();
    setTimeout(function(){ btn.textContent='Guardar'; btn.className='btn-save-plan'; btn.disabled=false; }, 2000);
  } catch(e) {
    btn.textContent = 'Error'; btn.disabled = false;
    showAlert('Error: ' + e.message, 'er');
  }
}

async function deleteUser() {
  if (!currentUserId) return;
  var name = document.getElementById('modalTitle').textContent;
  if (!confirm('¿Eliminar permanentemente a "' + name + '" y todos sus datos? Esta acción no se puede deshacer.')) return;
  try {
    await api('DELETE', 'delete_user', null, { userId: currentUserId });
    closeModal();
    loadUsers(currentPage);
    loadMetrics();
    showAlert('Usuario eliminado correctamente.', 'ok');
  } catch(e) {
    showAlert('Error eliminando usuario: ' + e.message, 'er');
  }
}

function confirmDelete(id, name) {
  if (!confirm('¿Eliminar a "' + name + '"? Esta acción no se puede deshacer.')) return;
  currentUserId = id;
  deleteUser();
}

function closeModal() {
  document.getElementById('userModal').classList.remove('open');
  currentUserId = null;
}

document.getElementById('userModal').addEventListener('click', function(e){
  if (e.target === this) closeModal();
});

// ── API helper ─────────────────────────────────────────────────
async function api(method, action, queryStr, body) {
  var url = '/api/admin?' + (action ? 'action='+action : '') + (queryStr ? '&'+queryStr : '');
  var opts = {
    method,
    headers: { 'x-admin-secret': ADMIN_SECRET, 'Content-Type': 'application/json' }
  };
  if (body) opts.body = JSON.stringify(body);
  var res  = await fetch(url, opts);
  var data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Error ' + res.status);
  return data;
}

// ── Helpers ────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' });
}
function showAlert(msg, type) {
  var el = document.getElementById('globalAlert');
  el.textContent = msg; el.className = 'alert-bar ' + type;
  setTimeout(function(){ el.className = 'alert-bar'; }, 4000);
}
</script>
